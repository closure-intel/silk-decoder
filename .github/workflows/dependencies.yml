name: Dependency inventory

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-inventory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Install build and development dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -c 'import subprocess, sys, tomllib; p=tomllib.load(open("pyproject.toml", "rb")); subprocess.check_call([sys.executable, "-m", "pip", "install", *p["build-system"]["requires"]])'
          .venv/bin/python -m pip install --no-build-isolation ".[dev]"
      - name: Check snapshot collection
        run: |
          .venv/bin/ruff check scripts/dependency_snapshot.py tests/test_dependency_snapshot.py
          .venv/bin/ruff format --check scripts/dependency_snapshot.py tests/test_dependency_snapshot.py
          .venv/bin/pytest -q tests/test_dependency_snapshot.py
      - name: Collect dependencies and verify vendored SDK
        run: .venv/bin/python scripts/dependency_snapshot.py --output "${RUNNER_TEMP}/dependency-evidence/snapshot.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-snapshot
          path: ${{ runner.temp }}/dependency-evidence/snapshot.json
          retention-days: 90
          if-no-files-found: error

  publish:
    needs: inventory
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-snapshot
          path: evidence
      - name: Submit dependency snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/dependency-graph/snapshots" --input evidence/snapshot.json
      - name: Export SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > export_sbom.py <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          API_ROOT = "https://api.github.com"
          repo = os.environ["GITHUB_REPOSITORY"]
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2026-03-10",
          }
          snapshot = json.load(open("evidence/snapshot.json"))
          expected = {p["package_url"] for m in snapshot["manifests"].values() for p in m["resolved"].values()}

          def api_request(path):
              request = urllib.request.Request(f"{API_ROOT}/repos/{repo}/{path}", headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=120) as response:
                      return response.status, response.read()
              except urllib.error.HTTPError as error:
                  return error.code, error.read()

          def load_sbom(payload):
              document = json.loads(payload)
              return document.get("sbom", document)

          def relevant_purls(sbom):
              actual = {
                  ref["referenceLocator"]
                  for package in sbom["packages"]
                  for ref in package.get("externalRefs", [])
                  if ref.get("referenceType") == "purl"
              }
              return {p for p in actual if p.startswith(("pkg:pypi/", "pkg:github/kn007/silk-v3-decoder@"))}

          def fetch_report(sbom_uuid):
              request = urllib.request.Request(
                  f"{API_ROOT}/repos/{repo}/dependency-graph/sbom/fetch-report/{sbom_uuid}",
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(request, timeout=120) as response:
                      return load_sbom(response.read())
              except urllib.error.HTTPError as error:
                  if error.code in {201, 202}:
                      return None
                  raise

          for attempt in range(1, 13):
              status, generated = api_request("dependency-graph/sbom/generate-report")
              if status != 201:
                  raise SystemExit(f"generate-report failed with HTTP {status}: {generated!r}")
              sbom_uuid = json.loads(generated)["sbom_url"].rstrip("/").rsplit("/", 1)[-1]
              sbom = None
              for _ in range(30):
                  sbom = fetch_report(sbom_uuid=sbom_uuid)
                  if sbom is not None:
                      break
                  time.sleep(2)
              if sbom is not None and relevant_purls(sbom=sbom) == expected:
                  json.dump({"sbom": sbom}, open("evidence/sbom.json", "w"), indent=2)
                  raise SystemExit(0)
              if attempt == 12:
                  raise SystemExit("SBOM does not yet match the submitted package versions")
              time.sleep(10)
          PY
          python export_sbom.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-sbom
          path: evidence/sbom.json
          retention-days: 90
          if-no-files-found: error
