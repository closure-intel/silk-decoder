name: Dependency inventory

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-inventory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Install build and development dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -c 'import subprocess, sys, tomllib; p=tomllib.load(open("pyproject.toml", "rb")); subprocess.check_call([sys.executable, "-m", "pip", "install", *p["build-system"]["requires"]])'
          .venv/bin/python -m pip install --no-build-isolation ".[dev]"
      - name: Check snapshot collection
        run: |
          .venv/bin/ruff check scripts/dependency_snapshot.py tests/test_dependency_snapshot.py
          .venv/bin/ruff format --check scripts/dependency_snapshot.py tests/test_dependency_snapshot.py
          .venv/bin/pytest -q tests/test_dependency_snapshot.py
      - name: Collect dependencies and verify vendored SDK
        run: .venv/bin/python scripts/dependency_snapshot.py --output "${RUNNER_TEMP}/dependency-evidence/snapshot.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-snapshot
          path: ${{ runner.temp }}/dependency-evidence/snapshot.json
          retention-days: 90
          if-no-files-found: error

  publish:
    needs: inventory
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dependency-snapshot
          path: evidence
      - name: Submit dependency snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/dependency-graph/snapshots" --input evidence/snapshot.json
      - name: Export SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > verify_export.py <<'PY'
          import json
          snapshot = json.load(open("evidence/snapshot.json"))
          expected = {p["package_url"] for m in snapshot["manifests"].values() for p in m["resolved"].values()}
          sbom = json.load(open("evidence/sbom.json"))["sbom"]
          actual = {r["referenceLocator"] for p in sbom["packages"] for r in p.get("externalRefs", []) if r.get("referenceType") == "purl"}
          relevant = {p for p in actual if p.startswith(("pkg:pypi/", "pkg:github/kn007/silk-v3-decoder@"))}
          assert relevant == expected, "SBOM does not yet match the submitted package versions"
          PY
          for attempt in $(seq 1 12); do
            if gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" > evidence/sbom.json; then
              python verify_export.py && break
            fi
            if [ "$attempt" -eq 12 ]; then exit 1; fi
            sleep 10
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-sbom
          path: evidence/sbom.json
          retention-days: 90
          if-no-files-found: error
