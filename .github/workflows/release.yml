name: Release

# Cut a release by pushing a MAJOR.MINOR.PATCH tag (no "v" prefix), matching how
# backend-service pins first-party deps (e.g. msg-parser @ ...@1.0.2). This builds the
# artifacts and publishes a GitHub Release; backend-service then installs via git+tag
# (see README "Consuming it"). No PyPI — this is a first-party, git-installed package.

on:
  push:
    tags: ["*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Verify tag matches the version in pyproject.toml
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "${GITHUB_REF_NAME}" != "${version}" ]; then
            echo "::error::tag '${GITHUB_REF_NAME}' does not match pyproject version '${version}' — bump the version first"
            exit 1
          fi

      - name: Test before releasing
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest -q

      - name: Build sdist + wheel
        run: |
          python -m pip install build
          python -m build

      - name: Publish GitHub Release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --title "silk-decoder ${GITHUB_REF_NAME}"
