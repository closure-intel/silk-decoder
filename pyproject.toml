[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "silk-decoder"
version = "0.1.0"
description = "In-house decoder for WeChat/Skype SILK (.silk) voice notes — pure Python, no third-party codec packages."
readme = "README.md"
requires-python = ">=3.14"
license = "BSD-3-Clause"
authors = [{ name = "Closure Intel" }]
keywords = ["silk", "wechat", "audio", "codec", "forensics"]
# No runtime dependencies. Standard library only — that is the whole point of this package
# (no pilk / pysilk / unmaintained codec wrappers). See README.md.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/silk_decoder"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]
